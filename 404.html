<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in Space | Driflare</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="fav.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --bg-primary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --glass-border: rgba(0, 0, 0, 0.08);
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        .dark {
            --bg-primary: #000000;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(20, 20, 25, 0.6);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Float Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(3deg); }
        }

        @keyframes floatFast {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(90px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
        }

        .animate-float {
            animation: floatSlow 6s ease-in-out infinite;
        }

        .animate-badge {
            animation: floatFast 3.5s ease-in-out infinite;
        }

        .animate-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .animate-orbit {
            animation: orbit 12s linear infinite;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .apple-gradient-text {
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col justify-between selection:bg-slate-900 selection:text-white dark:selection:bg-white dark:selection:text-black">

    <!-- Subtle Background Glow -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center">
        <div class="w-[500px] h-[500px] bg-slate-200 dark:bg-white/5 rounded-full blur-[120px] animate-glow"></div>
    </div>

    <!-- Header Navbar -->
    <header class="fixed top-4 left-0 w-full z-50 px-4 sm:px-8">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-3.5 rounded-full glass-card">
            <a href="https://driflare.com" class="font-display text-lg font-bold tracking-tight flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg border border-slate-300 dark:border-white/30 bg-slate-100 dark:bg-white/5 flex items-center justify-center relative overflow-hidden">
                    <div class="w-3.5 h-3.5 bg-slate-900 dark:bg-white rounded-sm transform rotate-45"></div>
                </div>
                Driflare
            </a>
            
            <button id="themeToggle" onclick="toggleTheme()" class="w-9 h-9 rounded-xl border border-slate-300 dark:border-white/10 bg-slate-100 dark:bg-white/5 flex items-center justify-center text-slate-700 dark:text-white transition-transform active:scale-95" title="Toggle theme">
                <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <svg class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-32 pb-16 px-6 min-h-screen flex items-center justify-center relative z-10">
        <div class="max-w-md w-full text-center">
            
            <!-- Cartoonish Animated Graphic -->
            <div class="relative w-64 h-64 mx-auto mb-8 flex items-center justify-center">
                <!-- Floating Orbiting Star -->
                <div class="absolute w-4 h-4 bg-amber-400 rounded-full animate-orbit shadow-lg shadow-amber-400/50"></div>
                
                <!-- Center Cartoon Box / Lost Satellite -->
                <div class="animate-float glass-card p-8 rounded-3xl shadow-2xl relative border-2 border-slate-900/10 dark:border-white/20">
                    <div class="w-28 h-28 mx-auto bg-slate-900 text-white dark:bg-white dark:text-black rounded-2xl flex items-center justify-center font-display font-bold text-5xl shadow-xl relative overflow-hidden">
                        <span class="z-10">404</span>
                        <!-- Playful Eyeballs -->
                        <div class="absolute top-3 left-4 w-3 h-3 bg-white dark:bg-slate-900 rounded-full flex items-center justify-center">
                            <div class="w-1.5 h-1.5 bg-slate-900 dark:bg-white rounded-full translate-x-0.5"></div>
                        </div>
                        <div class="absolute top-3 right-4 w-3 h-3 bg-white dark:bg-slate-900 rounded-full flex items-center justify-center">
                            <div class="w-1.5 h-1.5 bg-slate-900 dark:bg-white rounded-full translate-x-0.5"></div>
                        </div>
                    </div>

                    <!-- Cartoon Speech Badge -->
                    <div class="animate-badge absolute -bottom-4 right-2 bg-slate-900 text-white dark:bg-white dark:text-black text-[11px] font-mono px-3 py-1 rounded-full shadow-lg border border-slate-700 dark:border-slate-300">
                        Oops... Lost Signal? 🛰️
                    </div>
                </div>
            </div>

            <!-- Page Text -->
            <span class="text-xs uppercase font-mono text-slate-500 dark:text-white/40 tracking-widest mb-2 block">Error Code 404</span>
            <h1 class="font-display text-3xl sm:text-4xl font-bold mb-4 apple-gradient-text">Lost in Digital Space</h1>
            <p class="text-slate-600 dark:text-white/60 text-sm sm:text-base leading-relaxed mb-8">
                The page you are looking for has drifted off the radar, changed name, or no longer exists.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="https://driflare.com" class="w-full sm:w-auto px-7 py-3.5 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-black text-sm font-medium hover:opacity-90 transition-all shadow-md flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back to Safety
                </a>
                <a href="https://driflare.com/#contact" class="w-full sm:w-auto px-7 py-3.5 rounded-2xl border border-slate-300 dark:border-white/10 bg-slate-100 dark:bg-white/5 text-slate-800 dark:text-white text-sm font-medium hover:bg-slate-200 dark:hover:bg-white/10 transition-all">
                    Report Issue
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-6 text-center text-xs text-slate-500 dark:text-white/40 border-t border-slate-200 dark:border-white/10 relative z-10">
        © 2026 Driflare Inc. All rights reserved.
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</body>
</html>
