<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Driflare — Coming Soon</title>
  <meta name="description" content="Driflare is coming soon. We're working hard behind the scenes to bring you something amazing." />
  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo-removebg-preview.png" />
  <link rel="apple-touch-icon" href="logo-removebg-preview.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="Driflare — Coming Soon" />
  <meta property="og:description" content="We're working hard behind the scenes. Something great is on its way." />
  <meta property="og:image" content="logo-removebg-preview.png" />
  <meta property="og:type" content="website" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #161616;
      --accent: #3b82f6;
      --text: #ffffff;
      --muted: #a0a0a0;
      --border: rgba(255,255,255,0.07);
      --shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.22;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 55vw; height: 55vw;
      max-width: 600px; max-height: 600px;
      background: radial-gradient(circle, #1d4ed8, #3b82f6);
      top: -15vw; left: -15vw;
    }
    body::after {
      width: 45vw; height: 45vw;
      max-width: 500px; max-height: 500px;
      background: radial-gradient(circle, #1e3a8a, #2563eb);
      bottom: -10vw; right: -10vw;
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      background: #3b82f6;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }
    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* ── PAGE LAYOUT ── */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* ── LOGO SHOWCASE ── */
    .logo-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .logo-ring {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Spinning ring behind logo */
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
      background: linear-gradient(135deg, #3b82f6, transparent, #1d4ed8) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logo-ring img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      animation: glow 3s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(59,130,246,0.35)); }
      50%       { filter: drop-shadow(0 0 24px rgba(59,130,246,0.75)); }
    }

    .logo-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      letter-spacing: 0.06em;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 48px;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow);
      text-align: center;
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Emoji row */
    .emoji-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 1.9rem;
      margin-bottom: 22px;
    }
    .emoji-row span {
      display: inline-block;
      animation: bounce 1.8s ease-in-out infinite;
    }
    .emoji-row span:nth-child(1) { animation-delay: 0s; }
    .emoji-row span:nth-child(2) { animation-delay: 0.15s; }
    .emoji-row span:nth-child(3) { animation-delay: 0.3s; }
    .emoji-row span:nth-child(4) { animation-delay: 0.45s; }
    .emoji-row span:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40%       { transform: translateY(-9px); }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59,130,246,0.1);
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 100px;
      border: 1px solid rgba(59,130,246,0.25);
      margin-bottom: 20px;
    }
    .dot {
      width: 6px; height: 6px;
      background: #3b82f6;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.65); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 12px;
    }
    h1 span { color: #60a5fa; }

    .divider {
      width: 36px;
      height: 2px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    p {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: var(--muted);
      line-height: 1.8;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .footer-emojis {
      font-size: 1.15rem;
      letter-spacing: 8px;
      opacity: 0.35;
    }

    /* ── BOTTOM FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.05em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .logo-ring {
        width: 88px;
        height: 88px;
      }
      .logo-ring img {
        width: 64px;
        height: 64px;
      }
      .logo-name {
        font-size: 1.3rem;
      }
      .emoji-row {
        font-size: 1.6rem;
        gap: 7px;
      }
      .footer-emojis {
        letter-spacing: 5px;
      }
    }

    @media (max-width: 360px) {
      .card { padding: 26px 18px; }
      nav { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <!-- Nav -->
  <nav>
    <div class="nav-logo">
      <img src="logo-removebg-preview.png" alt="Driflare logo" />
      <span class="nav-brand">Driflare</span>
    </div>
  </nav>

  <!-- Main content -->
  <main class="page">

    <!-- Logo showcase -->
    <div class="logo-showcase">
      <div class="logo-ring">
        <img src="logo-removebg-preview.png" alt="Driflare" />
      </div>
      <span class="logo-name">Driflare</span>
    </div>

    <!-- Card -->
    <div class="card">

      <div class="emoji-row">
        <span>👋</span><span>✨</span><span>🚀</span><span>💙</span><span>🌟</span>
      </div>

      <div class="badge">
        <div class="dot"></div>
        Under Maintenance
      </div>

      <h1>Welcome to <span>Driflare!</span></h1>
      <div class="divider"></div>

      <p>
        Hey there, we're so glad you stopped by! 🙌<br>
        We're working hard behind the scenes to bring<br>
        you something truly amazing. Hang tight! 🛠️✨
      </p>

      <div class="footer-emojis">🌈 🦋 🌸 🍀 ⭐</div>

    </div>
  </main>

  <footer>© 2026 Driflare. All rights reserved.</footer>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        width: ${size}px;
        height: ${size}px;
        animation-duration: ${Math.random() * 12 + 8}s;
        animation-delay: ${Math.random() * 10}s;
      `;
      container.appendChild(p);
    }
  </script>

</body>
</html>
