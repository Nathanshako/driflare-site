<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Driflare — Coming Soon</title>
  <meta name="description" content="Driflare is coming soon. We're working hard behind the scenes to bring you something amazing." />
  <meta name="robots" content="index, follow" />

  <link rel="icon" type="image/png" href="logo-removebg-preview.png" />
  <link rel="apple-touch-icon" href="logo-removebg-preview.png" />
  <meta property="og:title" content="Driflare — Coming Soon" />
  <meta property="og:description" content="We're working hard behind the scenes. Something great is on its way." />
  <meta property="og:image" content="logo-removebg-preview.png" />
  <meta property="og:type" content="website" />

  <!-- Fonts: Cormorant Garamond for Driflare brand, Syne for UI -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Syne:wght@400;500;600&display=swap" rel="stylesheet"/>
  <!-- Lucide icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090d;
      --surface: rgba(255,255,255,0.04);
      --card: rgba(255,255,255,0.05);
      --accent: #3b82f6;
      --accent-soft: rgba(59,130,246,0.15);
      --text: #f0f2f5;
      --muted: #8a909c;
      --border: rgba(255,255,255,0.08);
      --glow: rgba(59,130,246,0.3);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      position: relative;
    }

    /* Subtle gradient mesh background */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(37,99,235,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 80%, rgba(29,78,216,0.1) 0%, transparent 70%);
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      background: #3b82f6;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh); opacity: 0; }
      8%   { opacity: 0.45; }
      92%  { opacity: 0.15; }
      100% { transform: translateY(-5vh); opacity: 0; }
    }

    /* ── NAVBAR ── */
    nav {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 58px;
      background: rgba(12, 14, 20, 0.55);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 1px 0 rgba(59,130,246,0.08), 0 4px 24px rgba(0,0,0,0.3);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      opacity: 0.95;
    }

    .nav-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 100px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #93c5fd;
    }

    .status-dot {
      width: 6px; height: 6px;
      background: #3b82f6;
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }

    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 16px;
      gap: 20px;
    }

    /* Logo block */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: rise 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    .logo-circle {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(59,130,246,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .logo-circle img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(59,130,246,0.4));
    }

    .logo-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 36px 28px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: rise 0.7s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mixed emoji + icon row */
    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 1.55rem;
    }

    .icon-row span { /* emoji */
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }
    .icon-row .i-icon { /* lucide icon wrapper */
      display: flex;
      align-items: center;
      color: #60a5fa;
      animation: bounce 2s ease-in-out infinite;
    }
    .icon-row span:nth-child(1), .icon-row .i-icon:nth-child(1) { animation-delay: 0s; }
    .icon-row span:nth-child(2), .icon-row .i-icon:nth-child(2) { animation-delay: 0.15s; }
    .icon-row span:nth-child(3), .icon-row .i-icon:nth-child(3) { animation-delay: 0.3s; }
    .icon-row span:nth-child(4), .icon-row .i-icon:nth-child(4) { animation-delay: 0.45s; }
    .icon-row span:nth-child(5), .icon-row .i-icon:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      42% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    h1 em {
      font-style: normal;
      color: #60a5fa;
    }

    .divider {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, #3b82f6, #93c5fd);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    p {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.75;
      font-weight: 400;
      margin-bottom: 22px;
    }

    /* Bottom icon strip — icons + emojis mixed */
    .bottom-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0.35;
      font-size: 1.1rem;
    }
    .bottom-strip .b-icon {
      display: flex;
      align-items: center;
      color: #93c5fd;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.06em;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      html, body { overflow: auto; }
      body { height: auto; min-height: 100dvh; }
      nav { padding: 0 18px; }
      .logo-circle { width: 72px; height: 72px; border-radius: 18px; }
      .logo-circle img { width: 48px; height: 48px; }
      .card { padding: 26px 22px 22px; }
      .icon-row { gap: 9px; font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="particles" id="particles"></div>

  <!-- Glassmorphic Navbar -->
  <nav>
    <div class="nav-left">
      <img class="nav-logo-img" src="logo-removebg-preview.png" alt="Driflare" />
      <span class="nav-brand">Driflare</span>
    </div>
    <div class="nav-right">
      <div class="nav-status">
        <div class="status-dot"></div>
        Maintenance
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main>

    <!-- Logo showcase -->
    <div class="logo-block">
      <div class="logo-circle">
        <img src="logo-removebg-preview.png" alt="Driflare logo" />
      </div>
      <span class="logo-title">Driflare</span>
    </div>

    <!-- Card -->
    <div class="card">

      <!-- 60% emojis (3), 40% icons (2) -->
      <div class="icon-row">
        <span>👋</span>
        <span class="i-icon"><i data-lucide="zap" width="26" height="26" stroke-width="1.8"></i></span>
        <span>🚀</span>
        <span class="i-icon"><i data-lucide="wrench" width="24" height="24" stroke-width="1.8"></i></span>
        <span>🌟</span>
      </div>

      <h1>Welcome to <em>Driflare!</em></h1>
      <div class="divider"></div>

      <p>
        Hey there, we're so glad you stopped by! 🙌<br>
        We're doing our best to get back to you —<br>
        something great is almost ready. ✨
      </p>

      <!-- Bottom strip: 3 emojis, 2 icons -->
      <div class="bottom-strip">
        <span>🌈</span>
        <span class="b-icon"><i data-lucide="sparkles" width="18" height="18" stroke-width="1.6"></i></span>
        <span>🍀</span>
        <span class="b-icon"><i data-lucide="heart" width="18" height="18" stroke-width="1.6"></i></span>
        <span>⭐</span>
      </div>

    </div>
  </main>

  <footer>© 2026 Driflare. All rights reserved.</footer>

  <script>
    // Init Lucide icons
    lucide.createIcons();

    // Particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 2.5 + 1;
      p.style.cssText = `
        left:${Math.random()*100}vw;
        width:${size}px;height:${size}px;
        animation-duration:${Math.random()*14+9}s;
        animation-delay:${Math.random()*12}s;
      `;
      container.appendChild(p);
    }
  </script>

</body>
</html>
