<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Driflare — Coming Soon</title>
  <meta name="description" content="Driflare is coming soon. We're working hard behind the scenes to bring you something amazing." />
  <meta name="robots" content="index, follow" />

  <link rel="icon" type="image/png" href="logo-removebg-preview.png" />
  <link rel="apple-touch-icon" href="logo-removebg-preview.png" />

  <meta property="og:title" content="Driflare — Coming Soon" />
  <meta property="og:description" content="We're working hard behind the scenes. Something great is on its way." />
  <meta property="og:image" content="logo-removebg-preview.png" />
  <meta property="og:type" content="website" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>

  <!-- Lucide icons CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4ff;
      --surface: rgba(255,255,255,0.75);
      --card: rgba(255,255,255,0.85);
      --accent: #3b82f6;
      --accent-light: #dbeafe;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(59,130,246,0.15);
      --shadow: 0 16px 48px rgba(59,130,246,0.1);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      overflow: hidden;
    }

    /* Soft mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(147,197,253,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(196,221,255,0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgba(224,236,255,0.5) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    /* ── NAV ── */
    nav {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 62px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(59,130,246,0.12);
      box-shadow: 0 1px 24px rgba(59,130,246,0.07);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.2);
      color: #3b82f6;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .pulse-dot {
      width: 6px; height: 6px;
      background: #3b82f6;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.6); }
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 16px;
      gap: 20px;
      overflow: hidden;
    }

    /* ── LOGO SECTION ── */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: rise 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }

    .logo-frame {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 8px 28px rgba(59,130,246,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-label {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 36px 44px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow);
      text-align: center;
      animation: rise 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mixed emoji + icon row */
    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .icon-row .emoji {
      font-size: 1.6rem;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    .icon-row .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--accent-light);
      color: var(--accent);
      animation: bounce 2s ease-in-out infinite;
    }

    .icon-row .icon-wrap svg {
      width: 18px; height: 18px;
    }

    .icon-row > *:nth-child(1) { animation-delay: 0s; }
    .icon-row > *:nth-child(2) { animation-delay: 0.15s; }
    .icon-row > *:nth-child(3) { animation-delay: 0.3s; }
    .icon-row > *:nth-child(4) { animation-delay: 0.45s; }
    .icon-row > *:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40%       { transform: translateY(-7px); }
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 10px;
      font-weight: 700;
    }
    h1 span { color: var(--accent); }

    .divider {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, #3b82f6, #93c5fd);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    p {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.75;
      font-weight: 300;
      margin-bottom: 22px;
    }

    /* Bottom info chips */
    .chips {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(59,130,246,0.06);
      border: 1px solid rgba(59,130,246,0.15);
      border-radius: 100px;
      padding: 5px 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .chip svg { width: 13px; height: 13px; color: var(--accent); }
    .chip .chip-emoji { font-size: 0.85rem; }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.7rem;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 540px) {
      body { overflow-y: auto; }
      nav { padding: 0 18px; }
      .card { padding: 28px 22px; border-radius: 18px; }
      .logo-frame { width: 66px; height: 66px; border-radius: 18px; }
      main { gap: 16px; padding: 16px 16px 12px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <div class="nav-left">
      <img class="nav-logo-img" src="logo-removebg-preview.png" alt="Driflare logo" />
      <span class="nav-brand">Driflare</span>
    </div>
    <div class="nav-badge">
      <div class="pulse-dot"></div>
      Under Maintenance
    </div>
  </nav>

  <!-- Main -->
  <main>

    <!-- Logo showcase -->
    <div class="logo-section">
      <div class="logo-frame">
        <img src="logo-removebg-preview.png" alt="Driflare" />
      </div>
      <span class="logo-label">Driflare</span>
    </div>

    <!-- Card -->
    <div class="card">

      <!-- 60% emojis, 40% icons -->
      <div class="icon-row">
        <span class="emoji">👋</span>
        <span class="icon-wrap"><i data-lucide="rocket"></i></span>
        <span class="emoji">✨</span>
        <span class="icon-wrap"><i data-lucide="zap"></i></span>
        <span class="emoji">🌟</span>
      </div>

      <h1>Welcome to <span>Driflare!</span></h1>
      <div class="divider"></div>

      <p>
        Hey there, we're so glad you stopped by! 🙌<br>
        We're doing our best to come back with something<br>
        truly amazing. Hang tight! 🛠️
      </p>

      <div class="chips">
        <div class="chip">
          <i data-lucide="clock"></i>
          Coming soon
        </div>
        <div class="chip">
          <span class="chip-emoji">💙</span>
          Built with care
        </div>
        <div class="chip">
          <i data-lucide="shield-check"></i>
          Stay tuned
        </div>
      </div>

    </div>
  </main>

  <footer>© 2026 Driflare. All rights reserved.</footer>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
